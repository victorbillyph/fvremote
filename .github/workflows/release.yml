name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            asset: fvremote-linux-amd64
          - os: windows-latest
            goos: windows
            asset: fvremote-windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux dependencies (GTK + WebKit2GTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libx11-dev libxtst-dev libxrandr-dev libxcursor-dev \
            libxinerama-dev libxi-dev libxfixes-dev

      - name: Install Wails
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          TAGS=""
          if [ "${{ matrix.goos }}" = "linux" ]; then TAGS="-tags webkit2_41"; fi
          "$(go env GOPATH)/bin/wails" build -s -skipbindings -m -nosyncgomod $TAGS
          ls -lh build/bin

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf "${{ matrix.asset }}.tar.gz" -C build/bin fvremote

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/fvremote.exe -DestinationPath "${{ matrix.asset }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.*

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
